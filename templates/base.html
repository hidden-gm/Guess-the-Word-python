<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07100b">
  <title>WORD//TRACE — Guess the Word</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<div class="app-shell">
  <div class="scanline"></div>
  <header class="topbar">
    <button class="brand" id="brandButton" type="button">
      <span class="brand-mark">W/</span>
      <span><strong>WORD</strong>//TRACE</span>
    </button>
    <div class="top-actions" id="topActions" hidden>
      <span class="identity"><i></i><span id="navUsername">PLAYER</span> <small id="navRole">PLAYER</small></span>
      <button id="navHome" type="button" class="ghost-btn">GAME</button>
      <button id="logoutButton" type="button" class="ghost-btn">EXIT</button>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><span>WORD//TRACE</span><span>Five letters. Five tries.</span></footer>
</div>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
